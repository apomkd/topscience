name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.17.1 --activate

      - name: Install web deps
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Build web
        run: pnpm --dir apps/web build
      - name: Start web for smoke
        run: |
          nohup pnpm --dir apps/web exec next start -p 3000 >/tmp/ci-web.log 2>&1 &
          sleep 2
      - name: Homepage smoke assert
        run: /opt/topscience/ops/scripts/ci-homepage-smoke.sh
